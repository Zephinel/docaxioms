name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so that checks comparing with origin/main have a base (A6).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # The lowest version package.json supports.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
